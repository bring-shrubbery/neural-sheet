name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-tests:
    name: Core package tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Select the newest installed Xcode
        run: |
          # shellcheck disable=SC2012
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: swift test
        working-directory: app/Packages/NeuralSheetCore
        run: |
          set -o pipefail
          # The whole log, not its tail: a crash before the first test prints its reason above
          # the last thirty lines.
          swift test 2>&1

  engine-tests:
    name: Engine package tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Select the newest installed Xcode
        run: |
          # shellcheck disable=SC2012
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      # No checkpoint is installed on the runner, so the oracle and checkpoint
      # suites skip themselves; the pure tests run. No test downloads a model.
      - name: swift test
        working-directory: app/Packages/NeuralSheetEngine
        run: |
          set -o pipefail
          swift test 2>&1 | tail -30

  app-build:
    name: Build the app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Select the newest installed Xcode
        run: |
          # shellcheck disable=SC2012
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Cache the engine build
        uses: actions/cache@v6
        with:
          path: app/build/engine
          key: engine-${{ runner.os }}-${{ hashFiles('.gitmodules') }}-${{ hashFiles('app/Scripts/build-engine.sh') }}
      - name: Build (Debug, unsigned)
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild -project NeuralSheet.xcodeproj -scheme NeuralSheet \
            -configuration Debug -destination 'platform=macOS,arch=arm64' \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log | tail -40
      - name: Fail on warnings in our own sources
        working-directory: app
        run: |
          if grep -E "/app/(NeuralSheet|Packages)/.*warning:" build.log; then
            echo "::error::warnings in NeuralSheet sources"; exit 1
          fi
          echo "no warnings in NeuralSheet sources"
      - name: Every string translated
        working-directory: app
        run: Scripts/check-localizations.sh --mac CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

  ios:
    name: Build the iOS app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Select the newest installed Xcode
        run: |
          # shellcheck disable=SC2012
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Cache the engine build
        uses: actions/cache@v6
        with:
          path: app/build/engine/iossimulator
          key: engine-iossimulator-${{ runner.os }}-${{ hashFiles('.gitmodules') }}-${{ hashFiles('app/Scripts/build-engine.sh') }}
      - name: Build (Debug, simulator, unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project NeuralSheet-iOS.xcodeproj -scheme NeuralSheet \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log | tail -40
      - name: Fail on warnings in our own sources
        working-directory: ios
        run: |
          if grep -E "/(ios/NeuralSheet|app/NeuralSheet|app/Packages)/.*warning:" build.log; then
            echo "::error::warnings in NeuralSheet sources"; exit 1
          fi
          echo "no warnings in NeuralSheet sources"
      - name: Test (simulator)
        working-directory: ios
        run: |
          set -o pipefail
          # The runner's Xcode has its own simulators (not the iPhone 18 Pro a local Xcode 27
          # has), so the first available iPhone is picked by id rather than by name.
          SIM=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone[^(]*\(([0-9A-F-]{36})\)' | grep -oE '[0-9A-F-]{36}')
          echo "testing on simulator $SIM"
          xcodebuild -project NeuralSheet-iOS.xcodeproj -scheme NeuralSheet \
            -destination "platform=iOS Simulator,id=$SIM" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tail -40
      - name: Every string translated
        working-directory: app
        run: Scripts/check-localizations.sh --ios CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

  plugin:
    name: Build and validate the Audio Unit
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      # demucs.cpp, which the extension links for Stems (sub-issue C).
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Select the newest installed Xcode
        run: |
          # shellcheck disable=SC2012
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Build (Debug, unsigned)
        working-directory: plugin
        run: |
          set -o pipefail
          xcodebuild -project NeuralSheet-Plugin.xcodeproj -scheme "NeuralSheet Plugin" \
            -configuration Debug -destination 'platform=macOS,arch=arm64' \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log | tail -40
      - name: Fail on warnings in our own sources
        working-directory: plugin
        run: |
          if grep -E "/(plugin/(Container|NeuralSheetAU|PluginCore)|app/(Packages|NeuralSheet))/.*warning:" build.log; then
            echo "::error::warnings in NeuralSheet sources"; exit 1
          fi
          echo "no warnings in NeuralSheet sources"
      # PluginCore's tests (the capture ring and session), signed ad hoc as there is no
      # certificate on the runner.
      - name: Test PluginCore
        working-directory: plugin
        run: |
          set -o pipefail
          xcodebuild -project NeuralSheet-Plugin.xcodeproj -scheme "NeuralSheet Plugin" \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            test 2>&1 | tail -40
      # Release, signed ad hoc (no certificate on the runner), registered with pluginkit, auval,
      # unregistered. Should the runner's session ever refuse the registration, set
      # NS_PLUGIN_SKIP_AUVAL: 1 here and say "build only" in the job's name.
      - name: Validate (auval)
        working-directory: plugin
        run: Scripts/validate.sh

  web:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
