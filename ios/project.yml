# The iOS app's project, generated by XcodeGen (iOS app design §2): `make project` writes
# NeuralSheet-iOS.xcodeproj from this file. Edit this, never the generated project.
name: NeuralSheet-iOS

options:
  bundleIdPrefix: com.quassum
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    # Mirrors the Mac target (app/NeuralSheet.xcodeproj), so the sources shared with it in
    # sub-issue B compile under the same language mode and isolation.
    ARCHS: arm64
    CLANG_CXX_LANGUAGE_STANDARD: c++23
    GCC_C_LANGUAGE_STANDARD: gnu17
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    SWIFT_VERSION: "5.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES

packages:
  NeuralSheetCore:
    path: ../app/Packages/NeuralSheetCore
  NeuralSheetEngine:
    path: ../app/Packages/NeuralSheetEngine

targets:
  NeuralSheet:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: NeuralSheet
      # The audio layer, shared with the Mac by path (iOS app design §2), minus the files that
      # are the HAL's or CoreMIDI's: device lists, private aggregates, process taps, the I/O
      # buffer request, the recording input picker and the MIDI output. Their iOS counterparts
      # are in NeuralSheet/Audio.
      - path: ../app/NeuralSheet/Audio
        excludes:
          - AudioDevices.swift
          - InputAggregate.swift
          - ProcessTap.swift
          - PlaybackEngine+Devices.swift
          - PlaybackEngine+IOBuffer.swift
          - RecordingInput.swift
          - MidiOutput.swift
          - MidiOutput+Sender.swift
          - MidiOutRing.swift
          - InstrumentSynthBank+MidiOut.swift
      # The engine wrapper and the stem separation bridge, compiled unchanged. The headless
      # pipeline is the batch window's, the CLI's and Shortcuts' (not on iOS) and leans on AppModel.
      - path: ../app/NeuralSheet/Engine
        excludes:
          - HeadlessTranscription.swift
          - HeadlessTranscription+Outputs.swift
          - HeadlessTranscription+Stems.swift
      # The vendored Ogg Vorbis decoder AudioFileLoader reads .ogg with, as on the Mac.
      - path: ../app/NeuralSheet/Decoders
    dependencies:
      - package: NeuralSheetCore
      - package: NeuralSheetEngine
        product: NeuralSheetEngine
    preBuildScripts:
      - name: Build engine
        basedOnDependencyAnalysis: false
        script: |
          case "$PLATFORM_NAME" in
              iphoneos) platform=ios ;;
              iphonesimulator) platform=iossimulator ;;
              *) echo "error: unsupported platform $PLATFORM_NAME" >&2; exit 1 ;;
          esac
          "$SRCROOT/../app/Scripts/build-engine.sh" "$platform"
    settings:
      base:
        PRODUCT_NAME: NeuralSheet
        PRODUCT_BUNDLE_IDENTIFIER: com.quassum.neuralsheet.ios
        MARKETING_VERSION: 1.1.0
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: 6WCYZER5LX
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: NeuralSheet/NeuralSheet-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/../app/ThirdParty/demucs.cpp/src
          - $(SRCROOT)/../app/ThirdParty/demucs.cpp/vendor/eigen
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(SRCROOT)/../app/build/engine/ios/lib
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(SRCROOT)/../app/build/engine/iossimulator/lib
        OTHER_LDFLAGS:
          - -ldemucs
          - -framework Metal
          - -framework Accelerate
    info:
      path: NeuralSheet/Info.plist
      properties:
        CFBundleDisplayName: NeuralSheet
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: NeuralSheet records from the microphone to transcribe what you play.

schemes:
  NeuralSheet:
    build:
      targets:
        NeuralSheet: all
    run:
      config: Debug
    archive:
      config: Release
