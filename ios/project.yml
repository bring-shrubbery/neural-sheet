# The iOS app's project, generated by XcodeGen (iOS app design §2): `make project` writes
# NeuralSheet-iOS.xcodeproj from this file. Edit this, never the generated project.
name: NeuralSheet-iOS

options:
  bundleIdPrefix: com.quassum
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    # Mirrors the Mac target (app/NeuralSheet.xcodeproj), so the sources shared with it in
    # sub-issue B compile under the same language mode and isolation.
    ARCHS: arm64
    CLANG_CXX_LANGUAGE_STANDARD: c++23
    GCC_C_LANGUAGE_STANDARD: gnu17
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    SWIFT_VERSION: "5.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES

packages:
  NeuralSheetCore:
    path: ../app/Packages/NeuralSheetCore
  NeuralSheetEngine:
    path: ../app/Packages/NeuralSheetEngine

targets:
  NeuralSheet:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: NeuralSheet
      # The audio layer, shared with the Mac by path (iOS app design §2), minus the files that
      # are the HAL's or CoreMIDI's: device lists, private aggregates, process taps, the I/O
      # buffer request, the recording input picker and the MIDI output. Their iOS counterparts
      # are in NeuralSheet/Audio.
      - path: ../app/NeuralSheet/Audio
        excludes:
          - AudioDevices.swift
          - InputAggregate.swift
          - ProcessTap.swift
          - PlaybackEngine+Devices.swift
          - PlaybackEngine+IOBuffer.swift
          - RecordingInput.swift
          - MidiOutput.swift
          - MidiOutput+Sender.swift
          - MidiOutRing.swift
          - InstrumentSynthBank+MidiOut.swift
      # The engine wrapper and the stem separation bridge, compiled unchanged. The headless
      # pipeline is the batch window's, the CLI's and Shortcuts' (not on iOS) and leans on AppModel.
      - path: ../app/NeuralSheet/Engine
        excludes:
          - HeadlessTranscription.swift
          - HeadlessTranscription+Outputs.swift
          - HeadlessTranscription+Stems.swift
      # The vendored Ogg Vorbis decoder AudioFileLoader reads .ogg with, as on the Mac.
      - path: ../app/NeuralSheet/Decoders
      # The project package's UTType, so both apps name the one type (sub-issue C).
      - path: ../app/NeuralSheet/App/ProjectType.swift
      # The core package's names (instruments, model sizes) in the user's language, and their
      # string table, as the Mac shows them (sub-issue D).
      - path: ../app/NeuralSheet/UI/Localization/CoreNames.swift
      - path: ../app/NeuralSheet/Core.xcstrings
      # The timeline's drawing, shared with the Mac by path (iOS app design §2, sub-issue E): the
      # geometry, the palette and text, the playhead layer and each band's `+Drawing.swift`
      # painter, over the theme, the type ramp and the locale's number formats. The AppKit
      # halves (the NSViews, their mouse handling, cards and VoiceOver) stay on the Mac; the
      # iPhone and iPad views over the same painters are in NeuralSheet/Timeline.
      - path: ../app/NeuralSheet/UI/Theme.swift
      - path: ../app/NeuralSheet/UI/Theme+Accommodations.swift
      - path: ../app/NeuralSheet/UI/Fonts.swift
      - path: ../app/NeuralSheet/UI/Localization/Formats.swift
      - path: ../app/NeuralSheet/UI/Timeline/TimelineGeometry.swift
      - path: ../app/NeuralSheet/UI/Timeline/TimelineDrawing.swift
      - path: ../app/NeuralSheet/UI/Timeline/PlayheadLayer.swift
      - path: ../app/NeuralSheet/UI/Timeline/PianoRollView+Drawing.swift
      - path: ../app/NeuralSheet/UI/Timeline/RulerView+Drawing.swift
      - path: ../app/NeuralSheet/UI/Timeline/WaveformView+Drawing.swift
      - path: ../app/NeuralSheet/UI/Timeline/KeyboardView+Drawing.swift
      - path: ../app/NeuralSheet/UI/Timeline/ChordLaneView+Drawing.swift
      # The editing commands' arithmetic, shared with the Mac by path (iOS app design §3, item 3;
      # sub-issue F): each works out a batch from the document and the editor state, which
      # MobileModel commits as AppModel does.
      - path: ../app/NeuralSheet/Shared
      # The faces the timeline draws its labels in (JetBrains Mono NL, Inter), registered at
      # launch as on the Mac.
      - path: ../app/NeuralSheet/Resources/Fonts
        buildPhase: resources
      # What the app and the widget extension share: the Live Activity's attributes.
      - path: Shared
    dependencies:
      - package: NeuralSheetCore
      - package: NeuralSheetEngine
        product: NeuralSheetEngine
      - target: NeuralSheetWidgets
    preBuildScripts:
      - name: Build engine
        basedOnDependencyAnalysis: false
        script: |
          case "$PLATFORM_NAME" in
              iphoneos) platform=ios ;;
              iphonesimulator) platform=iossimulator ;;
              *) echo "error: unsupported platform $PLATFORM_NAME" >&2; exit 1 ;;
          esac
          "$SRCROOT/../app/Scripts/build-engine.sh" "$platform"
    settings:
      base:
        PRODUCT_NAME: NeuralSheet
        PRODUCT_BUNDLE_IDENTIFIER: com.quassum.neuralsheet.ios
        MARKETING_VERSION: 1.1.0
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: 6WCYZER5LX
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: NeuralSheet/NeuralSheet-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/../app/ThirdParty/demucs.cpp/src
          - $(SRCROOT)/../app/ThirdParty/demucs.cpp/vendor/eigen
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(SRCROOT)/../app/build/engine/ios/lib
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(SRCROOT)/../app/build/engine/iossimulator/lib
        OTHER_LDFLAGS:
          - -ldemucs
          - -framework Metal
          - -framework Accelerate
    info:
      path: NeuralSheet/Info.plist
      properties:
        CFBundleDisplayName: NeuralSheet
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: NeuralSheet records from the microphone to transcribe what you play.
        # A run's progress on the Lock Screen and in the Dynamic Island (sub-issue D).
        NSSupportsLiveActivities: true
        # The project package (sub-issue C): the same declaration as app/Info.plist, so iCloud
        # Drive and Files show one type whichever app saved the file. The document browser is the
        # system's, and documents open in place where they are.
        UISupportsDocumentBrowser: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: NeuralSheet Project
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSTypeIsPackage: true
            LSItemContentTypes:
              - com.quassum.neuralsheet.project
          # Audio and video from the share sheet and other apps, which become a project's take
          # (sub-issue D). A viewer, not an owner: the app never writes these files.
          - CFBundleTypeName: Audio or Video
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.audio
              - public.movie
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.quassum.neuralsheet.project
            UTTypeDescription: NeuralSheet Project
            UTTypeConformsTo:
              - com.apple.package
            UTTypeTagSpecification:
              public.filename-extension:
                - neuralsheet

  # The Live Activity's drawing (sub-issue D), embedded in the app.
  NeuralSheetWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: NeuralSheetWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: NeuralSheetWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.quassum.neuralsheet.ios.widgets
        MARKETING_VERSION: 1.1.0
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: 6WCYZER5LX
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
    info:
      path: NeuralSheetWidgets/Info.plist
      properties:
        CFBundleDisplayName: NeuralSheet
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # The document round trip and whatever else needs the app's own types (sub-issue C), hosted by
  # the app and run on the simulator.
  NeuralSheetTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: NeuralSheetTests
    dependencies:
      - target: NeuralSheet
      - package: NeuralSheetCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quassum.neuralsheet.ios.tests
        DEVELOPMENT_TEAM: 6WCYZER5LX
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/NeuralSheet.app/NeuralSheet
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  NeuralSheet:
    build:
      targets:
        NeuralSheet: all
    test:
      config: Debug
      targets:
        - NeuralSheetTests
    run:
      config: Debug
    archive:
      config: Release
