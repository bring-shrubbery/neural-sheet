# The Audio Unit plugin's project, generated by XcodeGen (Audio Unit design §2): `make project`
# writes NeuralSheet-Plugin.xcodeproj from this file. Edit this, never the generated project.
#
# Two targets: a thin container app whose only job is to carry the extension (the system
# registers an app extension when the app holding it is first launched) and the AUv3 extension
# itself. The Mac app's project is untouched; if it is ever generated too, the extension moves
# into the main app unchanged.
name: NeuralSheet-Plugin

options:
  bundleIdPrefix: com.quassum
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    # Mirrors the Mac target (app/NeuralSheet.xcodeproj), so the sources shared with it from
    # sub-issue B on compile under the same language mode and isolation.
    ARCHS: arm64
    CLANG_CXX_LANGUAGE_STANDARD: c++23
    GCC_C_LANGUAGE_STANDARD: gnu17
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_VERSION: "5.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    ENABLE_HARDENED_RUNTIME: YES
    DEVELOPMENT_TEAM: 6WCYZER5LX
    CODE_SIGN_STYLE: Automatic
    # The plugin is released beside the app and carries its version.
    MARKETING_VERSION: 1.1.0
    CURRENT_PROJECT_VERSION: 1

packages:
  NeuralSheetCore:
    path: ../app/Packages/NeuralSheetCore
  NeuralSheetEngine:
    path: ../app/Packages/NeuralSheetEngine

targets:
  # The container: one window with the version and Open NeuralSheet. Not sandboxed, as the Mac
  # app is not (app/NeuralSheet/NeuralSheet.entitlements).
  NeuralSheet Plugin:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Container
    dependencies:
      - target: NeuralSheetAU
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_NAME: NeuralSheet Plugin
        PRODUCT_BUNDLE_IDENTIFIER: com.quassum.neuralsheet.plugin
        PRODUCT_MODULE_NAME: NeuralSheetPlugin
        ENABLE_APP_SANDBOX: NO
        # The App Group the app and the extension share (AppPaths.appGroupIdentifier), declared
        # by every target that carries the extension.
        CODE_SIGN_ENTITLEMENTS: Container/Container.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: NeuralSheet Plugin
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 Quassum. Apache License 2.0.
        ENABLE_PREVIEWS: YES

  # The AUv3 effect (design §2, "Audio path"). Sandboxed, as every app extension must be.
  NeuralSheetAU:
    type: app-extension
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: NeuralSheetAU
      # Free of AU types (design §3) so a wrapper for another plugin format remains possible.
      - path: PluginCore
      # The app's take, which a capture becomes (sub-issue B), shared by path as the iOS app does.
      - path: ../app/NeuralSheet/Audio/SourceAudio.swift
      # The waveform's drawing, shared with the Mac and iOS by path (sub-issue B): the painter
      # over the timeline geometry, the palette and text, the theme and the type ramp. The plugin's
      # NSView over it is NeuralSheetAU/TakeWaveformView.swift.
      - path: ../app/NeuralSheet/UI/Theme.swift
      - path: ../app/NeuralSheet/UI/Theme+Accommodations.swift
      - path: ../app/NeuralSheet/UI/Accessibility/Accommodations.swift
      - path: ../app/NeuralSheet/UI/Fonts.swift
      - path: ../app/NeuralSheet/UI/Localization/Formats.swift
      - path: ../app/NeuralSheet/UI/Timeline/TimelineGeometry.swift
      - path: ../app/NeuralSheet/UI/Timeline/TimelineDrawing.swift
      - path: ../app/NeuralSheet/UI/Timeline/WaveformView+Drawing.swift
      # The transcription (sub-issue C), compiled unchanged as the iOS app compiles it: the
      # engine wrapper over the NeuralSheetEngine package, the run's staging and landing, and the
      # stem separator with its C++ bridge to demucs.cpp (libdemucs.a, built for the Mac by the
      # pre-build script below, the same archive the app links).
      - path: ../app/NeuralSheet/Engine/TranscriptionEngine.swift
      - path: ../app/NeuralSheet/Engine/TranscriptionRun.swift
      - path: ../app/NeuralSheet/Engine/StemSeparator.swift
      - path: ../app/NeuralSheet/Audio/StemFiles.swift
      - path: ../app/NeuralSheet/Engine/nsheet_stems.h
      - path: ../app/NeuralSheet/Engine/nsheet_stems.cpp
    dependencies:
      - package: NeuralSheetCore
      - package: NeuralSheetEngine
        product: NeuralSheetEngine
      - sdk: AudioToolbox.framework
      - sdk: AVFAudio.framework
      - sdk: CoreAudioKit.framework
    settings:
      base:
        PRODUCT_NAME: NeuralSheetAU
        PRODUCT_BUNDLE_IDENTIFIER: com.quassum.neuralsheet.plugin.au
        SWIFT_OBJC_BRIDGING_HEADER: NeuralSheetAU/NeuralSheetAU-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/../app/ThirdParty/demucs.cpp/src
          - $(SRCROOT)/../app/ThirdParty/demucs.cpp/vendor/eigen
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/../app/build/engine/lib
        OTHER_LDFLAGS:
          - -ldemucs
          - -framework Metal
          - -framework Accelerate
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_ENTITLEMENTS: NeuralSheetAU/NeuralSheetAU.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: NeuralSheet
        SKIP_INSTALL: YES
    # The stem separation library for the Mac, as the app's own build phase makes it; a no-op
    # once built for the submodule's commit (app/Scripts/build-engine.sh).
    preBuildScripts:
      - name: Build engine
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/../app/Scripts/build-engine.sh" macos
    info:
      path: NeuralSheetAU/Info.plist
      properties:
        CFBundleDisplayName: NeuralSheet
        NSExtension:
          NSExtensionPointIdentifier: com.apple.AudioUnit-UI
          # The view controller is also the AUAudioUnitFactory, so it is both the principal
          # class and the factory the component names.
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NeuralSheetAUViewController
          NSExtensionAttributes:
            AudioComponents:
              - type: aufx
                subtype: NSht
                manufacturer: Qssm
                name: "Quassum: NeuralSheet"
                description: NeuralSheet
                # MARKETING_VERSION as the integer a component carries (major << 16 |
                # minor << 8 | patch: 1.1.0 is 0x010100), which hosts compare to decide whether a
                # cached scan is stale. An integer, so it cannot be a build setting; kept in step
                # with MARKETING_VERSION by hand, and Scripts/validate.sh fails when they disagree.
                version: 65792
                factoryFunction: $(PRODUCT_MODULE_NAME).NeuralSheetAUViewController
                sandboxSafe: true
                tags:
                  - Effects

  # PluginCore's tests (`xcodebuild test`), compiling its sources directly, as nothing hosts them.
  PluginCoreTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: PluginCoreTests
      - path: PluginCore
      - path: ../app/NeuralSheet/Audio/SourceAudio.swift
    dependencies:
      - package: NeuralSheetCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quassum.neuralsheet.plugin.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  NeuralSheet Plugin:
    build:
      targets:
        NeuralSheet Plugin: all
        NeuralSheetAU: all
    test:
      targets:
        - PluginCoreTests
    run:
      config: Debug
    archive:
      config: Release
